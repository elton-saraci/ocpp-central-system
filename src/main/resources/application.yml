spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
  ai:
    mcp:
      server:
        name: ocpp-central-system-mcp
        version: 0.0.1
        type: sync
        protocol: STATELESS
        stateless:
          mcp-endpoint: /mcp

logging:
  level:
    io.modelcontextprotocol.server.DefaultMcpStatelessServerHandler: ERROR

tags: tag1, tag2, tag3

websocket:
  port: 8080

server:
  port: 7070