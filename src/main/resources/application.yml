spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
  ai:
    mcp:
      server:
        name: ocpp-central-system-mcp
        version: 0.0.1
        type: sync
        protocol: STATELESS
        stateless:
          mcp-endpoint: /mcp

logging:
  level:
    io.modelcontextprotocol.server.DefaultMcpStatelessServerHandler: ERROR

tags: tag1, tag2, tag3

# ── Ports (default: two-port mode, router OFF) ─────────────────────────
# Default setup exposes both ports directly, e.g. local Docker or a VM with
# the firewall open for 7070 + 8080. The SinglePortRouter bean is disabled
# unless the "single-port" profile is active.
#
#   server.port    Spring Boot / Tomcat (REST API, Swagger, H2, MCP) - public
#   websocket.port OCPP server (charge point WebSocket endpoint) - public
#
# To run on a platform that only exposes ONE port (e.g. Render), activate the
# "single-port" profile with SPRING_PROFILES_ACTIVE=single-port
# (see application-single-port.yml).
# ───────────────────────────────────────────────────────────────────────
server:
  port: 7070

websocket:
  port: 8080