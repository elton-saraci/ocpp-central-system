spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
  ai:
    mcp:
      server:
        name: ocpp-central-system-mcp
        version: 0.0.1
        type: sync
        protocol: STATELESS
        stateless:
          mcp-endpoint: /mcp

logging:
  level:
    io.modelcontextprotocol.server.DefaultMcpStatelessServerHandler: ERROR

tags: tag1, tag2, tag3

# ── Ports ──────────────────────────────────────────────────────────────
# Only ONE port is exposed to the outside world: public.port.
# The other two are internal backends reachable only via the router.
#
#   public.port    the single "front door". On Render this is $PORT;
#                  locally it defaults to 7070. Every connection lands here
#                  and the SinglePortRouter sends WebSocket upgrades to the
#                  OCPP server and everything else to Tomcat.
#   websocket.port internal OCPP server (charge point WebSocket endpoint).
#   server.port    internal Spring Boot / Tomcat (REST API, Swagger, H2, MCP).
# ───────────────────────────────────────────────────────────────────────
websocket:
  port: 8080

public:
  port: ${PORT:7070}

server:
  port: 8081